<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel de administración — UMBRAL VR</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;900&family=Rajdhani:wght@500;600;700&family=Space+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/booking.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>

<div class="noise-layer"></div>

<main class="admin-login-page">
  <div class="admin-login-box">
    <img src="assets/umbral-vr-logo-nav.png" alt="UMBRAL VR" class="admin-login-logo">
    <p class="admin-login-tag">Panel de administración</p>

    <form id="loginForm" novalidate>
      <div class="bk-form-group" id="grp-username">
        <label for="username">Usuario</label>
        <input type="text" id="username" name="username" autocomplete="username" autocapitalize="off">
      </div>
      <div class="bk-form-group" id="grp-password">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" autocomplete="current-password">
      </div>
      <div class="bk-error-banner" id="loginError"></div>
      <button type="submit" class="btn btn-primary admin-login-btn" id="loginBtn">Ingresar</button>
    </form>
  </div>
</main>

<script>
  // Pon aquí la URL real de tu backend (el proyecto server/ en Railway).
  window.UMBRAL_API_BASE = 'https://web-production-6f38d.up.railway.app/api';
</script>
<script src="js/admin.js"></script>
</body>
</html>
