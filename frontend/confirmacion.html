<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Confirmación de reserva — UMBRAL VR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;900&family=Rajdhani:wght@500;600;700&family=Space+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/booking.css">
</head>
<body>

<div class="noise-layer"></div>

<header class="booking-topbar">
  <div class="container">
    <a href="index.html" class="booking-back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      Volver al sitio
    </a>
    <a href="index.html" class="logo logo-img"><img src="assets/umbral-vr-logo-nav.png" alt="UMBRAL VR"></a>
  </div>
</header>

<main class="confirm-box" id="confirmBox">
  <div class="bk-spinner" style="margin:0 auto;"></div>
  <p style="margin-top:20px;color:var(--text-dim);font-family:var(--font-mono);font-size:0.85rem;">Verificando tu pago…</p>
</main>

<script>
  const API_BASE = window.UMBRAL_API_BASE || 'http://localhost:4000/api';
  const params = new URLSearchParams(window.location.search);
  const status = params.get('status');
  const bookingId = params.get('booking');
  const box = document.getElementById('confirmBox');

  function renderOk(detail) {
    box.innerHTML = `
      <div class="confirm-icon ok">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M20 6L9 17l-5-5"/></svg>
      </div>
      <h1>¡Reserva confirmada!</h1>
      <p>Te enviamos los detalles a tu correo. Te esperamos en la arena.</p>
      ${detail}
      <div style="margin-top:32px;">
        <a href="index.html" class="btn btn-primary">Volver al inicio</a>
      </div>`;
  }

  function renderFail(message) {
    box.innerHTML = `
      <div class="confirm-icon fail">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </div>
      <h1>No pudimos confirmar el pago</h1>
      <p>${message}</p>
      <div style="margin-top:32px;display:flex;gap:14px;justify-content:center;">
        <a href="reserva.html" class="btn btn-primary">Intentar de nuevo</a>
        <a href="index.html" class="btn btn-ghost">Volver al inicio</a>
      </div>`;
  }

  async function init() {
    if (status === 'cancelled') {
      return renderFail('Cancelaste el pago antes de completarlo. No se realizó ningún cobro.');
    }
    if (status === 'failed') {
      return renderFail('El pago fue rechazado por tu banco o medio de pago. Intenta nuevamente o usa otra tarjeta.');
    }
    if (status === 'error' || !status) {
      return renderFail('Ocurrió un problema verificando tu pago. Si el dinero fue descontado, contáctanos con tu código de reserva.');
    }

    if (status === 'ok' && bookingId) {
      try {
        const res = await fetch(`${API_BASE}/bookings/${bookingId}`);
        const data = await res.json();
        if (!res.ok || data.status !== 'paid') {
          return renderFail('Tu reserva aún no aparece como pagada. Si el dinero fue descontado, contáctanos.');
        }
        const detail = `
          <div class="confirm-detail">
            <div><span>Código</span><span>${data.id.slice(0, 8).toUpperCase()}</span></div>
            <div><span>Experiencia</span><span>${data.game.title}</span></div>
            <div><span>Fecha</span><span>${data.date}</span></div>
            <div><span>Hora</span><span>${data.time} hrs</span></div>
            <div><span>Jugadores</span><span>${data.players}</span></div>
            <div><span>Total</span><span>$${Number(data.priceClp).toLocaleString('es-CL')} CLP</span></div>
          </div>`;
        renderOk(detail);
      } catch (err) {
        renderFail('No pudimos verificar tu reserva automáticamente. Si el dinero fue descontado, contáctanos.');
      }
    } else {
      renderFail('No encontramos información de tu pago.');
    }
  }

  init();
</script>

</body>
</html>
